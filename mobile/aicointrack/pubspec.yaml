name: aicointrack
description: "AI-powered crypto & expense tracker on Base."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Firebase ──────────────────────────────────────────────────────────────────
  firebase_core: ^3.5.0
  firebase_auth: ^5.3.0
  google_sign_in: ^6.2.1

  # ── Networking ────────────────────────────────────────────────────────────────
  http: ^1.2.0

  # ── State / Storage ───────────────────────────────────────────────────────────
  provider: ^6.1.1
  shared_preferences: ^2.3.3

  # ── Auth: Base smart-wallet via miniapp deep-link ─────────────────────────────
  # Opens https://app.aicointrack.xyz/login in a Custom Tab / SFSafariViewController
  # and captures the aicointrack:// callback URL.
  flutter_web_auth_2: ^4.0.1

  # ── Auth: External wallets (MetaMask, Rainbow, Trust…) ───────────────────────
  reown_appkit: ^1.4.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
